name: Taiwan Momentum V2 Daily
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: '指定交易日 YYYY-MM-DD；填 2026-10-16 產生 Day 1，留空代表最近已完成的交易日'
        required: false
        type: string
  schedule:
    # 18:30 Asia/Taipei (UTC+8) Monday to Friday; holiday/stale-date guard in Python.
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      ETF_SYMBOLS: '0050,00981A,00403A'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Cache yearly / weekly archives
        uses: actions/cache@v4
        with:
          path: data/archive
          key: momentum-v2-archive-${{ runner.os }}-2026-v1
      - name: Run screener
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$REPORT_DATE" ]; then
              python screener.py --cache data/archive --output output --as-of "$REPORT_DATE"
            else
              python screener.py --cache data/archive --output output --allow-stale
            fi
          else
            python screener.py --cache data/archive --output output
          fi
      - name: Show entire report on Actions Summary
        if: always()
        run: |
          if [ -f output/report.md ]; then
            cat output/report.md >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '---' >> "$GITHUB_STEP_SUMMARY"
            echo '[固定最新報告頁面](https://github.com/${{ github.repository }}/tree/main/dashboard) · [完整 HTML 檔](https://github.com/${{ github.repository }}/blob/main/dashboard/report.html)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## 本次沒有產出報告' >> "$GITHUB_STEP_SUMMARY"
            echo '可能是非交易日／官方收盤資料尚未更新；請查閱 Run screener 的紀錄。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest dashboard to Repository
        if: success()
        run: |
          if [ ! -f output/report.html ] || [ ! -f output/report.md ] || [ ! -f output/metadata.json ]; then
            echo "No completed report; dashboard unchanged."
            exit 0
          fi
          mkdir -p dashboard
          NEW_DATE=$(python -c 'import json;print(json.load(open("output/metadata.json"))["as_of"])')
          if [ -f dashboard/metadata.json ]; then
            OLD_DATE=$(python -c 'import json;print(json.load(open("dashboard/metadata.json"))["as_of"])')
            if [[ "$NEW_DATE" < "$OLD_DATE" ]]; then
              echo "Historical report $NEW_DATE is older than published $OLD_DATE; preserving the latest dashboard."
              exit 0
            fi
          fi
          cp output/report.md dashboard/README.md
          cp output/report.html dashboard/report.html
          cp output/metadata.json dashboard/metadata.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/README.md dashboard/report.html dashboard/metadata.json
          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git commit -m "Update momentum dashboard for $NEW_DATE"
          git push origin HEAD:main

      - name: Upload screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-v2-report-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 90
