name: Taiwan Momentum V2 Daily
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: '指定交易日 YYYY-MM-DD；填 2026-10-16 產生 Day 1，留空代表最近已完成的交易日'
        required: false
        type: string
  schedule:
    # 18:30 Asia/Taipei (UTC+8) Monday to Friday; holiday/stale-date guard in Python.
    - cron: '30 10 * * 1-5'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      ETF_SYMBOLS: '0050,00981A,00403A'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Cache yearly / weekly archives
        uses: actions/cache@v4
        with:
          path: data/archive
          key: momentum-v2-archive-${{ runner.os }}-2026-v1
      - name: Run screener
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$REPORT_DATE" ]; then
              python screener.py --cache data/archive --output output --as-of "$REPORT_DATE"
            else
              python screener.py --cache data/archive --output output --allow-stale
            fi
          else
            python screener.py --cache data/archive --output output
          fi
      - name: Upload screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-v2-report-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 90
