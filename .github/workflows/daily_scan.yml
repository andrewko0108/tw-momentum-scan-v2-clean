name: Taiwan Momentum V2 Daily
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: '指定交易日 YYYY-MM-DD；填 2026-10-16 產生 Day 1，留空代表最近已完成的交易日'
        required: false
        type: string
      email_report:
        description: '手動執行後寄出報告 Email（預設不寄；自動排程會寄）'
        required: false
        type: boolean
        default: false
  schedule:
    # 18:43 Asia/Taipei (UTC+8) Mon-Fri; avoid peak scheduling boundaries.
    # GitHub cron may be delayed until the next local calendar day.
    - cron: '43 10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      ETF_SYMBOLS: '0050,00981A,00403A'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Cache yearly / weekly archives
        uses: actions/cache@v5
        with:
          path: data/archive
          key: momentum-v2-archive-${{ runner.os }}-2026-v1
      - name: Run screener
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$REPORT_DATE" ]; then
              python screener.py --cache data/archive --output output --as-of "$REPORT_DATE"
            else
              python screener.py --cache data/archive --output output --allow-stale
            fi
          else
            # Cron may arrive after midnight Taipei. Use latest verified close.
            python screener.py --cache data/archive --output output --allow-stale
          fi

      - name: Identify new completed trading report
        id: report_gate
        if: success()
        shell: bash
        run: |
          if [ ! -s output/report.html ] || [ ! -s output/report.md ] || [ ! -s output/metadata.json ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "No completed report; nothing to publish or email."
            exit 0
          fi

          NEW_DATE=$(python -c 'import json;print(json.load(open("output/metadata.json"))["as_of"])')
          echo "source_date=$NEW_DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Compare against live main instead of the trigger's possibly stale SHA.
            git fetch origin main --quiet
            OLD_DATE=$(git show origin/main:dashboard/metadata.json 2>/dev/null \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("as_of", ""))' \
              || true)
            if [ -n "$OLD_DATE" ] && [[ "$NEW_DATE" == "$OLD_DATE" || "$NEW_DATE" < "$OLD_DATE" ]]; then
              echo "new=false" >> "$GITHUB_OUTPUT"
              echo "Report for $NEW_DATE already published (current: $OLD_DATE); skipping duplicate update/email."
              exit 0
            fi
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "Verified trading date $NEW_DATE; ready to publish."

      - name: Show entire report on Actions Summary
        if: always()
        run: |
          if [ -f output/report.md ]; then
            cat output/report.md >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '---' >> "$GITHUB_STEP_SUMMARY"
            echo '[固定最新報告頁面](https://github.com/${{ github.repository }}/tree/main/dashboard) · [完整 HTML 檔](https://github.com/${{ github.repository }}/blob/main/dashboard/report.html)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## 本次沒有產出報告' >> "$GITHUB_STEP_SUMMARY"
            echo '可能是非交易日／官方收盤資料尚未更新；請查閱 Run screener 的紀錄。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish latest dashboard to Repository
        if: ${{ success() && steps.report_gate.outputs.new == 'true' }}
        run: |
          if [ ! -f output/report.html ] || [ ! -f output/report.md ] || [ ! -f output/metadata.json ]; then
            echo "No completed report; dashboard unchanged."
            exit 0
          fi
          # Publish onto the latest branch head even when scheduling is delayed.
          git fetch origin main --quiet
          git checkout -B report-publish origin/main
          mkdir -p dashboard
          NEW_DATE=$(python -c 'import json;print(json.load(open("output/metadata.json"))["as_of"])')
          if [ -f dashboard/metadata.json ]; then
            OLD_DATE=$(python -c 'import json;print(json.load(open("dashboard/metadata.json"))["as_of"])')
            if [[ "$NEW_DATE" < "$OLD_DATE" ]]; then
              echo "Historical report $NEW_DATE is older than published $OLD_DATE; preserving the latest dashboard."
              exit 0
            fi
          fi
          cp output/report.md dashboard/README.md
          cp output/report.html dashboard/report.html
          cp output/metadata.json dashboard/metadata.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/README.md dashboard/report.html dashboard/metadata.json
          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git commit -m "Update momentum dashboard for $NEW_DATE"
          git push origin HEAD:main

      - name: Send daily report email
        if: ${{ success() && steps.report_gate.outputs.new == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.email_report == true)) }}
        env:
          REPORT_SMTP_USER: 'andrewko0108@gmail.com'
          REPORT_SMTP_APP_PASSWORD: ${{ secrets.REPORT_SMTP_APP_PASSWORD }}
          REPORT_EMAIL_TO: 'andrewko0108@gmail.com'
        run: python email_report.py --report output/report.html --metadata output/metadata.json --markdown output/report.md

      - name: Upload screening report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: momentum-v2-report-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 90
